name: Update formulas

# Every hour, and on demand: point each formula at its project's latest release.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Write the formulas
        run: python3 update.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Commit what changed
        run: |
          if git diff --quiet; then
            echo "Every formula is at its latest release"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Update formulas to the latest releases"
          git push
